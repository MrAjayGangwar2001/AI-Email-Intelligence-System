server:
  port: 8080

spring:
  application:
    name: email-intelligence-system

  # ---- Supabase (PostgreSQL) connection ----
  # Get these values from Supabase Project Settings -> Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'validate' recommended once schema.sql has been run manually on Supabase.
      # Use 'update' only during early local development.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    default-property-inclusion: non_null

# ---- Custom app config ----
app:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:mistral:7b}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:240}

  groq:
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.1-8b-instant}
    timeout-seconds: ${GROQ_TIMEOUT_SECONDS:30}

  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    api-base-url: https://api.telegram.org

  email-processing:
    max-body-chars: 5000          # truncate very long email bodies before sending to AI
    dedupe-enabled: true

  reminders:
    enabled: true
    lead-minutes: 30              # nudge this many minutes before a deadline
    check-interval-ms: 300000     # how often to check for upcoming deadlines (5 min)

  digest:
    enabled: true
    cron: "0 0 8 * * *"           # 8:00 AM daily
    zone: ${TZ:Asia/Kolkata}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    root: INFO
    com.emailintelligence: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info